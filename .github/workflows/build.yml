name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Raster.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: raster-debug-apk
          path: Raster.apk

      # Fester Link auf die neueste APK: …/releases/latest/download/Raster.apk
      - name: Release mit APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Raster Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Raster.apk
          make_latest: true
